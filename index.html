<!DOCTYPE html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRFS - Grow Rich From Small</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
:root{--bg:#f1f5f9;--fs:16px}
body{font-family:system-ui;background:var(--bg);margin:0;padding:16px 16px 70px;font-size:var(--fs)}
.card{background:#fff;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.jar{border-radius:14px;padding:12px 14px;margin:6px 0;color:#fff;font-weight:800;display:flex;justify-content:space-between}
input,select{width:100%;padding:14px;border-radius:12px;border:2px solid #e2e8f0;font-size:1em;margin-top:8px;box-sizing:border-box;background:#fff}
button{width:100%;padding:14px;border-radius:12px;border:none;background:#0f172a;color:#fff;font-weight:800;margin-top:8px}
.small{font-size:.8em;color:#64748b}
.badge{padding:3px 8px;border-radius:12px;font-size:10px;font-weight:800;margin-left:4px}
.need{background:#dcfce7;color:#166534}.want{background:#fee2e2;color:#991b1b}.sec{background:#fef9c3;color:#854d0e}.repay{background:#dbeafe;color:#1e40af}
.hist-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9}
.milestone{background:#0f172a;color:#fff;border-radius:18px;padding:16px;margin-top:14px}
.progress{height:10px;background:#334155;border-radius:10px;overflow:hidden;margin-top:8px}.progress-fill{height:100%;background:#22c55e}
.road-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1e293b}
.target-select{background:#0f172a;color:#fff;border:2px solid #334155;font-weight:800}
details{margin-top:10px;background:#f8fafc;border-radius:10px;padding:8px 10px}summary{font-weight:800;cursor:pointer}
.sec-box{display:flex;gap:6px;margin-top:8px}.sec-box input{flex:2}.sec-btn{flex:1;font-size:.9em!important}
.honest-box{display:flex;gap:8px;background:#fffbeb;border:2px solid #fde68a;border-radius:10px;padding:8px 10px;margin-top:10px}.honest-box input{width:auto}
.settings-btn{position:fixed;top:12px;right:12px;background:#fff;width:44px;height:44px;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:20px;display:flex;align-items:center;justify-content:center;z-index:100;cursor:pointer}
.settings-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;padding:14px;overflow:auto}
.settings-panel{background:#fff;border-radius:18px;padding:16px;max-width:500px;margin:20px auto}
.set-row{display:flex;gap:6px;margin-top:8px}.set-row input,.set-row button{flex:1}
.color-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.color-dot{height:36px;border-radius:10px;border:3px solid transparent;cursor:pointer}.color-dot.active{border-color:#0f172a}
.danger{background:#fee2e2;color:#991b1b}
</style>
</head><body>
<div class="settings-btn" onclick="openSettings()">⚙️</div>
<div id="settingsOverlay" class="settings-overlay" onclick="if(event.target==this)closeSettings()">
<div class="settings-panel">
<h2 style="margin:0">⚙️ Settings</h2>
<h4>🔤 Font Size</h4><select id="setFont" onchange="changeFont()"><option value="14px">Small</option><option value="16px">Medium</option><option value="18px">Large</option><option value="20px">XL</option><option value="22px">Big Eye</option></select>
<h4>🎨 Background</h4><div class="color-grid">
<div class="color-dot" style="background:#f1f5f9" onclick="changeBg('#f1f5f9',this)"></div>
<div class="color-dot" style="background:#fff" onclick="changeBg('#ffffff',this)"></div>
<div class="color-dot" style="background:#fef9c3" onclick="changeBg('#fef9c3',this)"></div>
<div class="color-dot" style="background:#dcfce7" onclick="changeBg('#dcfce7',this)"></div>
<div class="color-dot" style="background:#dbeafe" onclick="changeBg('#dbeafe',this)"></div>
<div class="color-dot" style="background:#f3e8ff" onclick="changeBg('#f3e8ff',this)"></div>
<div class="color-dot" style="background:#ffedd5" onclick="changeBg('#ffedd5',this)"></div>
<div class="color-dot" style="background:#0f172a" onclick="changeBg('#0f172a',this)"></div>
</div><div class="set-row"><input id="customBg" type="color"><button onclick="changeBg(document.getElementById('customBg').value,null)">Use Custom</button></div>
<h4>🎯 Target & Correct Total</h4><select id="setTarget" onchange="changeTargetS()" style="width:100%;padding:14px;border-radius:12px;border:2px solid #e2e8f0;font-weight:800"><option value="1000000">₦1M</option><option value="2000000">₦2M</option><option value="5000000">₦5M</option><option value="10000000">₦10M</option><option value="20000000">₦20M</option><option value="50000000">₦50M</option></select><div class="set-row"><input id="setTotal" type="number" placeholder="Correct total"><button onclick="updateTotal()">Save</button></div>
<h4>💰 Change 50/20/15/10/5 %</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="p1" type="number" placeholder="SURVIVAL"><input id="p2" type="number" placeholder="SECURITY"><input id="p3" type="number" placeholder="GROWTH"><input id="p4" type="number" placeholder="SOUL"><input id="p5" type="number" placeholder="SEED"></div><button onclick="savePerc()">Save %</button><button onclick="resetPerc()" style="background:#e2e8f0;color:#0f172a">Reset Default</button>
<h4>📤 Export & Share</h4><button onclick="exportData()" style="background:#0ea5e9">Export Story</button><button onclick="shareApp()" style="background:#8b5cf6">Share Link</button>
<h4>🗑️ Danger Zone</h4><button class="danger" onclick="resetSec()">Reset SECURITY Only</button><button class="danger" onclick="clearAll()">Clear All Data</button>
<button onclick="closeSettings()" style="background:#f1f5f9;color:#0f172a;margin-top:12px">Close</button>
</div></div>
<div id="app"></div>
<script src="app.js?v=5"></script>
</body></html>
