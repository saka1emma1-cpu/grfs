<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRFS - Grow Rich From Small</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
body{font-family:system-ui;background:#f1f5f9;margin:0;padding:16px}
.card{background:white;border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.jar{border-radius:16px;padding:14px;margin:8px 0;color:white;font-weight:800;display:flex;justify-content:space-between}
input,select{width:100%;padding:16px;border-radius:14px;border:2px solid #e2e8f0;font-size:18px;margin-top:8px;box-sizing:border-box}
button{width:100%;padding:16px;border-radius:14px;border:none;background:#0f172a;color:white;font-size:17px;font-weight:900;margin-top:10px}
.small{font-size:12px;color:#64748b}
.hist-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:800}
.need{background:#dcfce7;color:#166534}.want{background:#fee2e2;color:#991b1b}
.milestone{background:linear-gradient(135deg,#0f172a,#1e293b);color:white;border-radius:20px;padding:18px;margin-top:16px}
.milestone b{color:#22c55e}
</style>
</head>
<body>
<div id="app"></div>
<script>
var income = Number(localStorage.getItem('grfs_income') || 0);
var myHistory = JSON.parse(localStorage.getItem('grfs_history') || '[]');
var totalSecurity = Number(localStorage.getItem('grfs_total_security') || 0);

function render(){
  var app = document.getElementById('app');
  var html = '<h1>🌱 GRFS</h1><b>Grow Rich From Small</b><p>How much entered today?</p>';
  html += '<input id="inc" type="number" inputmode="numeric" placeholder="e.g 5000" value="' + (income||'') + '" />';
  html += '<button onclick="saveIncome()">Share My Money Wisely</button>';
  if(income>0){
    var sec = Math.round(income*0.2);
    html += '<h3>Your N' + income + ' shared:</h3>';
    html += '<div class="jar" style="background:#0ea5e9"><span>SURVIVAL 50%</span><span>N' + Math.round(income*0.5) + '</span></div>';
    html += '<div class="jar" style="background:#22c55e"><span>SECURITY 20% - Ajo</span><span>N' + sec + '</span></div>';
    html += '<div class="jar" style="background:#f59e0b"><span>GROWTH 15%</span><span>N' + Math.round(income*0.15) + '</span></div>';
    html += '<div class="jar" style="background:#8b5cf6"><span>SOUL 10%</span><span>N' + Math.round(income*0.1) + '</span></div>';
    html += '<div class="jar" style="background:#06b6d4"><span>SEED 5%</span><span>N' + Math.round(income*0.05) + '</span></div>';

    var dailySave = sec;
    var daysTo1M = dailySave>0? Math.ceil(1000000 / dailySave) : 0;
    var months = (daysTo1M/30).toFixed(1);
    html += '<div class="milestone"><h3 style="margin:0">🚀 Road to ₦1,000,000</h3>';
    html += '<p class="small" style="color:#94a3b8">Saving N' + dailySave + ' daily</p>';
    html += '<p>Total Saved: <b>N' + totalSecurity + '</b> | Remain: <b>N' + (1000000 - totalSecurity) + '</b></p>';
    if(daysTo1M>0){ html += '<p>You go reach ₦1M in <b>' + daysTo1M + ' days</b> (~' + months + ' months)</p>'; }
    html += '</div>';

    html += '<div class="card"><h4>⚠️ Spend Check</h4><input id="spendItem" type="text" inputmode="text" placeholder="Wetin you wan buy? e.g. Shoe" /><input id="spend" type="number" inputmode="numeric" placeholder="How much? e.g. 1500" /><select id="type"><option value="need">NEED</option><option value="liability">WANT - Bet/Shayo</option></select><button onclick="checkSpend()">Check Am</button><div id="msg" style="margin-top:10px;font-weight:bold"></div></div>';

    html += '<div class="card"><h4>📜 History</h4>';
    if(myHistory.length===0){ html += '<p class="small">No history yet.</p>'; }
    else {
      var totalNeed = 0, totalWant = 0;
      for(var i=0;i<myHistory.length;i++){
        var h = myHistory[i];
        if(h.type==='need') totalNeed += h.amount; else totalWant += h.amount;
        html += '<div class="hist-item"><span><b>' + h.item + '</b> - N' + h.amount + ' <span class="badge ' + (h.type==='need'?'need':'want') + '">' + h.type + '</span><br><span class="small">' + h.date + '</span></span><span onclick="delHist(' + i + ')" style="color:red;font-weight:800">✕</span></div>';
      }
      html += '<p class="small">NEED: N' + totalNeed + ' | WANT: N' + totalWant + '</p>';
      html += '<button onclick="clearHist()" style="background:#fee2e2;color:#991b1b">Clear History</button>';
    }
    html += '</div>';
    html += '<div class="card"><h4>💜 How you feel?</h4><div style="display:flex;gap:8px"><button onclick="mood(&quot;Happy&quot;)">😊</button><button onclick="mood(&quot;Okay&quot;)">😐</button><button onclick="mood(&quot;Stressed&quot;)">😔</button></div><p class="small">' + (localStorage.getItem('grfs_mood')||'') + '</p></div>';
  }
  app.innerHTML = html;
}
function saveIncome(){
  var v = document.getElementById('inc').value;
  if(!v){ alert('Put amount'); return; }
  income = Number(v);
  var sec = Math.round(income*0.2);
  totalSecurity += sec;
  localStorage.setItem('grfs_income', v);
  localStorage.setItem('grfs_total_security', totalSecurity);
  render();
}
function checkSpend(){
  var itemEl = document.getElementById('spendItem');
  var amtEl = document.getElementById('spend');
  var typeEl = document.getElementById('type');
  var msgEl = document.getElementById('msg');
  var item = itemEl.value || 'That thing';
  var a = Number(amtEl.value);
  var t = typeEl.value;
  if(!a){ msgEl.innerHTML = 'Put amount first!'; return; }
  myHistory.unshift({item:item, amount:a, type:t, date:new Date().toLocaleDateString()});
  localStorage.setItem('grfs_history', JSON.stringify(myHistory));
  if(t==='liability'){ msgEl.innerHTML = '🛑 HOLD! ' + item + ' = N' + a + ' daily = N' + (a*30) + '/month!'; msgEl.style.color='red'; }
  else { msgEl.innerHTML = '✅ Good. ' + item + ' is NEED. Max N' + Math.round(income*0.5); msgEl.style.color='green'; }
  // Don't call render immediately so message shows, then render after 1.5 sec
  setTimeout(render, 1500);
}
function delHist(i){ myHistory.splice(i,1); localStorage.setItem('grfs_history', JSON.stringify(myHistory)); render(); }
function clearHist(){ if(confirm('Clear all?')){ myHistory=[]; localStorage.setItem('grfs_history','[]'); render(); } }
function mood(x){ localStorage.setItem('grfs_mood', x); render(); }
render();
</script>
</body>
</html>
