<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRFS - Grow Rich From Small</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
*{box-sizing:border-box} body{font-family:system-ui;background:#f1f5f9;margin:0;padding:16px}

</style>
</head>
<body>
