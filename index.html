<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRFS - Grow Rich From Small</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
body{font-family:system-ui;background:#f1f5f9;margin:0;padding:16px}
.card{background:white;border-radius:20px;padding:16px;margin-top:12px}
.jar{border-radius:16px;padding:14px;margin:8px 0;color:white;font-weight:800;display:flex;justify-content:space-between}
input,select{width:100%;padding:16px;border-radius:14px;border:2px solid #e2e8f0;font-size:18px;margin-top:8px}
button{width:100%;padding:16px;border-radius:14px;border:none;background:#0f172a;color:white;font-size:17px;font-weight:900;margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var income = Number(localStorage.getItem('grfs_income') || 0);
function render(){
  var app = document.getElementById('app');
  var html = '<h1>🌱 GRFS</h1><b>Grow Rich From Small</b><p>How much entered today?</p>';
  html += '<input id="inc" type="number" inputmode="numeric" placeholder="e.g 5000" value="' + (income||'') + '" />';
  html += '<button onclick="saveIncome()">Share My Money Wisely</button>';
  if(income>0){
    html += '<h3>Your N' + income + ' shared:</h3>';
    html += '<div class="jar" style="background:#0ea5e9"><span>SURVIVAL 50%</span><span>N' + Math.round(income*0.5) + '</span></div>';
    html += '<div class="jar" style="background:#22c55e"><span>SECURITY 20% - Ajo</span><span>N' + Math.round(income*0.2) + '</span></div>';
    html += '<div class="jar" style="background:#f59e0b"><span>GROWTH 15%</span><span>N' + Math.round(income*0.15) + '</span></div>';
    html += '<div class="jar" style="background:#8b5cf6"><span>SOUL 10%</span><span>N' + Math.round(income*0.1) + '</span></div>';
    html += '<div class="jar" style="background:#06b6d4"><span>SEED 5%</span><span>N' + Math.round(income*0.05) + '</span></div>';
    html += '<div class="card"><h4>⚠️ Spend Check</h4><input id="spendItem" type="text" inputmode="text" placeholder="Wetin you wan buy? e.g. Shayo" /><input id="spend" type="number" inputmode="numeric" placeholder="How much? e.g. 2000" /><select id="type"><option value="need">NEED</option><option value="liability">WANT - Bet/Shayo</option></select><button onclick="checkSpend()">Check Am</button><div id="msg" style="margin-top:10px;font-weight:bold"></div></div>';
    html += '<div class="card"><h4>💜 How you feel?</h4><button onclick="mood(&quot;Happy&quot;)">😊 Happy</button><button onclick="mood(&quot;Okay&quot;)">😐 Okay</button><button onclick="mood(&quot;Stressed&quot;)">😔 Stressed</button><p id="moodText">' + (localStorage.getItem('grfs_mood')||'') + '</p></div>';
  }
  app.innerHTML = html;
}
function saveIncome(){
  var v = document.getElementById('inc').value;
  if(!v){ alert('Put amount'); return; }
  income = Number(v);
  localStorage.setItem('grfs_income', v);
  render();
}
function checkSpend(){
  var item = document.getElementById('spendItem').value || 'That thing';
  var a = Number(document.getElementById('spend').value);
  var t = document.getElementById('type').value;
  var m = document.getElementById('msg');
  if(!a){ m.innerHTML = 'Put amount first!'; m.style.color='black'; return; }
  if(t==='liability'){ m.innerHTML = '🛑 HOLD! ' + item + ' = N' + a + ' daily = N' + (a*30) + ' per month gone! Put for SECURITY!'; m.style.color='red'; }
  else { m.innerHTML = '✅ Good. ' + item + ' is NEED. Make sure e no pass N' + Math.round(income*0.5); m.style.color='green'; }
}
function mood(x){ localStorage.setItem('grfs_mood', x); alert('Noted: ' + x); render(); }
render();
</script>
</body>
</html>
